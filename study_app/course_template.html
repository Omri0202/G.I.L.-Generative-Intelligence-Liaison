<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G.I.L. Study</title>
<style>
/* ═══════ hand-drawn, colourful, fun study app ═══════ */
:root{
  --paper:#FFF7EC; --paper2:#FFEFD9; --ink:#3B3730; --ink2:#6B6459;
  --line:#2B2824;
  --c1:#58CC63; --c2:#4AB6E8; --c3:#A66BE0; --c4:#FF9A3D; --c5:#FF6FA5; --c6:#22C7B8;
  --gold:#FFC93C; --ok:#58CC63; --fail:#FF5C6C;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;
  background:var(--paper);
  background-image:radial-gradient(circle at 20% 10%,rgba(74,182,232,.06),transparent 40%),
    radial-gradient(circle at 80% 30%,rgba(166,107,224,.06),transparent 40%),
    radial-gradient(circle at 50% 90%,rgba(88,204,99,.06),transparent 45%);
  color:var(--ink);min-height:100vh;}
body[dir="rtl"]{direction:rtl;}
::-webkit-scrollbar{width:10px;}::-webkit-scrollbar-thumb{background:#E4D8C4;border-radius:6px;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
h1,h2,h3,.fun{font-family:"Baloo 2","Comic Sans MS","Segoe UI",cursive;}

/* the hand-drawn border trick — irregular corners + wobbly ink outline */
.hd{border:3px solid var(--line);
  border-radius:255px 18px 225px 18px/18px 225px 18px 255px;}
.hd2{border:3px solid var(--line);
  border-radius:18px 225px 18px 255px/225px 18px 255px 18px;}

/* chunky pressable button (Duolingo signature) */
.chunk{position:relative;border:3px solid var(--line);border-radius:16px;
  padding:12px 24px;font-weight:800;font-size:15px;color:#fff;
  box-shadow:0 5px 0 0 rgba(0,0,0,.28);transition:transform .06s,box-shadow .06s;
  transform:translateY(0);}
.chunk:active{transform:translateY(5px);box-shadow:0 0 0 0 rgba(0,0,0,.28);}
.chunk.g{background:var(--c1);} .chunk.b{background:var(--c2);}
.chunk.p{background:var(--c3);} .chunk.o{background:var(--c4);}
.chunk.grey{background:#E9DFCE;color:var(--ink);}
.chunk:disabled{opacity:.5;cursor:default;box-shadow:0 5px 0 0 rgba(0,0,0,.15);}

/* top bar */
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;
  padding:12px 22px;background:var(--paper2);border-bottom:3px solid var(--line);}
header .mascot{width:44px;height:44px;flex-shrink:0;animation:bob 2.4s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-4px) rotate(3deg);}}
header .title{font-weight:800;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pill{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px;
  padding:6px 12px;border-radius:14px;border:3px solid var(--line);background:#fff;}
.pill.xp{color:#E8940A;} .pill.streak{color:var(--c3);} .pill.done{color:var(--c1);}

/* intro */
.intro{max-width:640px;margin:20px auto 4px;padding:0 20px;text-align:center;}
.intro h1{font-size:26px;margin-bottom:4px;line-height:1.15;}
.intro p{color:var(--ink2);font-size:15px;}
.bar{height:16px;background:#fff;border:3px solid var(--line);border-radius:12px;
  margin:16px auto 4px;overflow:hidden;max-width:420px;}
.bar > i{display:block;height:100%;
  background:repeating-linear-gradient(45deg,var(--c1),var(--c1) 10px,#4bbd56 10px,#4bbd56 20px);
  border-radius:9px;transition:width .6s cubic-bezier(.2,.9,.3,1);}
.barlabel{font-size:13px;color:var(--ink2);font-weight:700;}

/* winding path */
.path{max-width:640px;margin:8px auto 70px;padding:0 20px;}
.unit{margin-top:34px;}
.unit .banner{display:inline-block;padding:8px 18px;color:#fff;font-weight:800;font-size:16px;
  margin-bottom:4px;transform:rotate(-1.4deg);}
.unit .udesc{color:var(--ink2);font-size:13.5px;margin:4px 2px 16px;font-weight:600;}
.levels{display:flex;flex-direction:column;align-items:center;gap:2px;}
.node{display:flex;flex-direction:column;align-items:center;position:relative;
  transition:transform .1s;}
.node.off{transform:translateX(-72px);} .node.off2{transform:translateX(72px);}
body[dir="rtl"] .node.off{transform:translateX(72px);}
body[dir="rtl"] .node.off2{transform:translateX(-72px);}
.node .dot{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:26px;font-weight:900;color:#fff;
  border:4px solid var(--line);box-shadow:0 6px 0 0 rgba(0,0,0,.25);
  transition:transform .08s,box-shadow .08s;}
.node.avail .dot,.node.done .dot{cursor:pointer;}
.node.avail .dot:active,.node.done .dot:active{transform:translateY(5px);box-shadow:0 1px 0 0 rgba(0,0,0,.25);}
.node.locked .dot{background:#E9DFCE!important;color:#B9AC95;box-shadow:0 6px 0 0 rgba(0,0,0,.12);}
.node.avail .dot{animation:pulse 1.8s ease-in-out infinite;}
@keyframes pulse{0%,100%{box-shadow:0 6px 0 0 rgba(0,0,0,.25),0 0 0 0 rgba(255,201,60,.5);}
  50%{box-shadow:0 6px 0 0 rgba(0,0,0,.25),0 0 0 10px rgba(255,201,60,0);}}
.node .ltitle{font-size:12.5px;color:var(--ink2);margin:5px 0 2px;max-width:190px;
  text-align:center;font-weight:700;}
.node .link{width:5px;height:26px;background:repeating-linear-gradient(var(--line),var(--line) 5px,transparent 5px,transparent 11px);margin:2px 0;}
.node .crown{position:absolute;top:-14px;font-size:20px;}

/* lesson overlay */
.overlay{position:fixed;inset:0;background:rgba(59,55,48,.55);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;z-index:100;padding:14px;}
.overlay.on{display:flex;animation:fade .2s ease;}
@keyframes fade{from{opacity:0}to{opacity:1}}
.lesson{width:100%;max-width:600px;background:var(--paper);border:4px solid var(--line);
  border-radius:24px;overflow:hidden;box-shadow:0 14px 0 0 rgba(0,0,0,.25);
  display:flex;flex-direction:column;max-height:92vh;}
.lhead{display:flex;align-items:center;gap:14px;padding:16px 20px;}
.close{font-size:22px;color:var(--ink2);font-weight:900;}
.hpbar{flex:1;height:16px;background:#fff;border:3px solid var(--line);border-radius:12px;overflow:hidden;}
.hpbar > i{display:block;height:100%;background:var(--c2);border-radius:9px;transition:width .3s;}
.hearts{color:var(--fail);font-size:17px;letter-spacing:1px;}
.qbody{padding:8px 24px 20px;overflow-y:auto;flex:1;}
.qkind{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--c2);margin-bottom:10px;}
.qtext{font-size:20px;font-weight:700;line-height:1.5;margin-bottom:22px;white-space:pre-wrap;}
.qtext code{background:#fff;border:2px solid var(--line);border-radius:7px;padding:1px 6px;font-size:.85em;}
.qbody pre{background:#2B2824;color:#F5EEDD;border-radius:12px;padding:12px 14px;overflow-x:auto;
  font-family:"Cascadia Code",Consolas,monospace;font-size:13px;margin:12px 0;direction:ltr;text-align:left;}
.opts{display:flex;flex-direction:column;gap:12px;}
.opt{text-align:start;padding:15px 18px;background:#fff;border:3px solid var(--line);
  border-radius:16px;font-size:16px;font-weight:600;box-shadow:0 4px 0 0 rgba(0,0,0,.15);
  transition:transform .06s,box-shadow .06s,background .12s;}
.opt:active{transform:translateY(4px);box-shadow:0 0 0 0 rgba(0,0,0,.15);}
.opt.sel{background:#EAF6FF;border-color:var(--c2);}
.opt.right{background:#E7FBEA;border-color:var(--ok);}
.opt.wrong{background:#FFECEE;border-color:var(--fail);}
.opt.dim{opacity:.45;}
input.answer{width:100%;padding:15px 18px;border:3px solid var(--line);border-radius:16px;
  background:#fff;color:var(--ink);font-size:17px;font-weight:600;outline:none;
  box-shadow:0 4px 0 0 rgba(0,0,0,.12);}
input.answer:focus{border-color:var(--c2);}
.feedback{margin-top:16px;padding:14px 16px;border-radius:16px;font-size:15px;
  line-height:1.55;font-weight:600;display:none;}
.feedback.on{display:block;animation:pop .25s cubic-bezier(.2,1.4,.4,1);}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.feedback.good{background:#E7FBEA;border:3px solid var(--ok);color:#1E7A2C;}
.feedback.bad{background:#FFECEE;border:3px solid var(--fail);color:#B32330;}
.lfoot{padding:16px 20px;display:flex;justify-content:flex-end;gap:10px;}

/* celebration */
.done-card{text-align:center;padding:34px 24px;}
.done-card .big{font-size:56px;margin-bottom:6px;animation:pop .4s cubic-bezier(.2,1.6,.4,1);}
.done-card h3{font-size:24px;margin-bottom:6px;}
.done-card p{color:var(--ink2);font-weight:600;}
.done-card .xpwin{color:#E8940A;font-weight:900;font-size:20px;margin-top:14px;}
.confetti{position:fixed;top:-10px;width:11px;height:16px;z-index:200;pointer-events:none;border-radius:2px;}
</style></head>
<body>
<header>
  <svg class="mascot" viewBox="0 0 48 48" fill="none" stroke="#2B2824" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 22 Q24 4 38 22 Q40 40 24 42 Q8 40 10 22Z" fill="#58C4DD"/>
    <circle cx="19" cy="24" r="3" fill="#2B2824" stroke="none"/>
    <circle cx="29" cy="24" r="3" fill="#2B2824" stroke="none"/>
    <path d="M19 31 Q24 34 29 31"/>
    <path d="M24 12 L24 6" /><circle cx="24" cy="5" r="1.6" fill="#2B2824" stroke="none"/>
  </svg>
  <div class="title" id="courseTitle">Study Course</div>
  <div class="pill streak" title="Streak"><span>🔥</span><span id="streakN">0</span></div>
  <div class="pill xp" title="XP"><span>⭐</span><span id="xpN">0</span></div>
  <div class="pill done" title="Done"><span>✅</span><span id="doneN">0</span>/<span id="totalN">0</span></div>
</header>

<div class="intro">
  <h1 id="introTitle"></h1>
  <p id="introSub"></p>
  <div class="bar"><i id="overallBar" style="width:0%"></i></div>
  <div class="barlabel" id="overallLabel">0%</div>
</div>

<div class="path" id="path"></div>
<div class="overlay" id="overlay"><div class="lesson" id="lesson"></div></div>

<script>
"use strict";
const COURSE = /*__COURSE__*/ {"title":"Study Course","subtitle":"","lang":"en","units":[]} /*__END__*/;
const UC = ["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)","var(--c6)"];
const CHUNK = ["g","b","p","o","g","b"];

const $ = id => document.getElementById(id);
const esc = s => (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
if(COURSE.lang==="he") document.body.setAttribute("dir","rtl");
const KEY = "gilstudy_" + (COURSE.title||"course").replace(/\W+/g,"_").slice(0,40);

let LEVELS=[]; COURSE.units.forEach((u,ui)=>u.levels.forEach((l,li)=>LEVELS.push({u:ui,ref:l})));
let state = load();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{done:{},xp:0,streak:0}}catch(e){return{done:{},xp:0,streak:0}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function completed(){return Object.keys(state.done).length;}
function isDone(i){return !!state.done[i];}
function isAvail(i){return i===0||isDone(i-1)||isDone(i);}

function qhtml(t){t=esc(t);t=t.replace(/```([\s\S]*?)```/g,(m,c)=>"<pre>"+c.trim()+"</pre>");
  return t.replace(/`([^`]+)`/g,"<code>$1</code>");}

function renderPath(){
  $("courseTitle").textContent=COURSE.title||"Study Course";
  $("introTitle").textContent=COURSE.title||"Study Course";
  $("introSub").textContent=COURSE.subtitle||"";
  $("totalN").textContent=LEVELS.length; $("doneN").textContent=completed();
  $("xpN").textContent=state.xp||0; $("streakN").textContent=state.streak||0;
  const pct=LEVELS.length?Math.round(completed()/LEVELS.length*100):0;
  $("overallBar").style.width=pct+"%"; $("overallLabel").textContent=pct+"% "+(COURSE.lang==="he"?"הושלם":"complete");
  const path=$("path"); path.innerHTML=""; let gi=0;
  COURSE.units.forEach((u,ui)=>{
    const col=UC[ui%UC.length];
    const unit=document.createElement("div"); unit.className="unit";
    unit.innerHTML=`<div class="banner hd" style="background:${col}">${esc(u.title||"")}</div>`+
      (u.desc?`<div class="udesc">${esc(u.desc)}</div>`:"")+`<div class="levels"></div>`;
    const levels=unit.querySelector(".levels");
    u.levels.forEach((l,li)=>{
      const idx=gi++, done=isDone(idx), avail=isAvail(idx);
      const off=li%3===1?"off":(li%3===2?"off2":"");
      const node=document.createElement("div");
      node.className="node "+off+" "+(done?"done":(avail?"avail":"locked"));
      node.innerHTML=(done?`<div class="crown">👑</div>`:"")+
        `<div class="dot" style="background:${col}">${done?"★":(avail?"▶":"🔒")}</div>`+
        `<div class="ltitle">${esc(l.title||("Level "+(li+1)))}</div>`+
        (li<u.levels.length-1?`<div class="link"></div>`:"");
      if(done||avail) node.querySelector(".dot").onclick=()=>openLesson(idx);
      levels.appendChild(node);
    });
    path.appendChild(unit);
  });
}

let cur=null;
function openLesson(idx){
  const qs=(LEVELS[idx].ref.questions||[]).filter(q=>q&&q.q);
  if(!qs.length){alert("No questions here yet.");return;}
  cur={idx,qs,qi:0,correct:0,hearts:3};
  $("overlay").classList.add("on"); drawQ();
}
function closeLesson(){$("overlay").classList.remove("on");cur=null;}

function drawQ(){
  const c=cur,q=c.qs[c.qi],opts=q.options||[],isInput=q.type==="input"||!opts.length;
  const pct=Math.round(c.qi/c.qs.length*100);
  const he=COURSE.lang==="he";
  $("lesson").innerHTML=
    `<div class="lhead"><button class="close" onclick="closeLesson()">✕</button>`+
    `<div class="hpbar"><i style="width:${pct}%"></i></div>`+
    `<div class="hearts">${"❤".repeat(c.hearts)}${"🖤".repeat(3-c.hearts)}</div></div>`+
    `<div class="qbody"><div class="qkind">${he?"שאלה":"Question"} ${c.qi+1}/${c.qs.length}</div>`+
    `<div class="qtext">${qhtml(q.q)}</div>`+
    (isInput?`<input class="answer" id="ans" placeholder="${he?"הקלד תשובה…":"Type your answer…"}" autocomplete="off">`
      :`<div class="opts" id="opts">`+opts.map((o,i)=>`<button class="opt" data-i="${i}">${qhtml(o)}</button>`).join("")+`</div>`)+
    `<div class="feedback" id="fb"></div></div>`+
    `<div class="lfoot"><button class="chunk g" id="check" disabled>${he?"בדוק":"Check"}</button></div>`;
  let sel=null;
  if(isInput){const inp=$("ans");
    inp.oninput=()=>$("check").disabled=!inp.value.trim();
    inp.onkeydown=e=>{if(e.key==="Enter"&&inp.value.trim())doCheck(inp.value.trim());};
    setTimeout(()=>inp.focus(),50); $("check").onclick=()=>doCheck(inp.value.trim());
  }else{$("opts").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    $("opts").querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));
    b.classList.add("sel");sel=+b.dataset.i;$("check").disabled=false;});
    $("check").onclick=()=>doCheck(sel);}
}

function doCheck(given){
  const c=cur,q=c.qs[c.qi],opts=q.options||[],isInput=q.type==="input"||!opts.length,he=COURSE.lang==="he";
  let ok;
  if(isInput){const n=s=>String(s).trim().toLowerCase().replace(/\s+/g," ");
    ok=n(given)===n(q.answer)||(Array.isArray(q.answer)&&q.answer.some(a=>n(a)===n(given)));
  }else{ok=given===q.answer;
    $("opts").querySelectorAll(".opt").forEach((n,i)=>{n.style.pointerEvents="none";
      if(i===q.answer)n.classList.add("right");else if(i===given)n.classList.add("wrong");else n.classList.add("dim");});}
  const fb=$("fb"); fb.className="feedback on "+(ok?"good":"bad");
  fb.innerHTML=(ok?(he?"<b>✓ נכון!</b> ":"<b>✓ Correct!</b> "):(he?"<b>✕ לא בדיוק.</b> ":"<b>✕ Not quite.</b> "))+
    (q.explain?esc(q.explain):(ok?"":(he?"התשובה: ":"Answer: ")+"<b>"+esc(isInput?q.answer:opts[q.answer])+"</b>"));
  if(ok)c.correct++;else c.hearts=Math.max(0,c.hearts-1);
  const btn=$("check"); btn.disabled=false;
  btn.textContent=(c.qi<c.qs.length-1)?(he?"המשך":"Continue"):(he?"סיום":"Finish");
  btn.className="chunk "+(ok?"g":"o");
  btn.onclick=()=>{if(c.hearts<=0){finish(false);return;}c.qi++;if(c.qi>=c.qs.length)finish(true);else drawQ();};
}

function confetti(){for(let i=0;i<70;i++){const d=document.createElement("div");d.className="confetti";
  d.style.left=Math.random()*100+"vw";d.style.background=UC[i%UC.length].replace("var(--c","#").replace(")","")||"#58CC63";
  const cols=["#58CC63","#4AB6E8","#A66BE0","#FF9A3D","#FF6FA5","#FFC93C"];d.style.background=cols[i%cols.length];
  d.style.transform="rotate("+Math.random()*360+"deg)";document.body.appendChild(d);
  const fall=800+Math.random()*900;d.animate([{top:"-10px",opacity:1},{top:"100vh",opacity:.9}],{duration:fall,easing:"ease-in"});
  setTimeout(()=>d.remove(),fall);}}

function finish(passed){
  const c=cur,score=Math.round(c.correct/c.qs.length*100),won=passed&&score>=60,he=COURSE.lang==="he";
  if(won&&!isDone(c.idx)){state.done[c.idx]=true;state.xp=(state.xp||0)+10+c.correct*5;state.streak=(state.streak||0)+1;save();confetti();}
  else if(!won){state.streak=0;save();}
  $("lesson").innerHTML=`<div class="done-card"><div class="big">${won?"🎉":"💪"}</div>`+
    `<h3>${won?(he?"עברת את השלב!":"Level complete!"):(he?"כמעט שם":"Almost!")}</h3>`+
    `<p>${he?`ענית נכון על ${c.correct} מתוך ${c.qs.length} (${score}%).`:`You got ${c.correct} of ${c.qs.length} right (${score}%).`}`+
    `${won?"":(he?" צריך 60% כדי לעבור.":" You need 60% to pass.")}</p>`+
    (won?`<div class="xpwin">+${10+c.correct*5} XP</div>`:"")+
    `<div class="lfoot" style="justify-content:center;margin-top:22px;">`+
    (won?"":`<button class="chunk grey" onclick="openLesson(${c.idx})">${he?"שוב":"Retry"}</button>`)+
    `<button class="chunk g" onclick="closeLesson();renderPath()">${won?(he?"המשך":"Continue"):(he?"חזרה":"Back")}</button>`+
    `</div></div>`;
}
renderPath();
</script>
</body></html>
