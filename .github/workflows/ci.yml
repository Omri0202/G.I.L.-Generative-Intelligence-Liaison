name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        # cryptography: Vigil's cloud store tests. python-dotenv: the live model
        # test, which then skips itself here because CI has no Groq key.
        run: python -m pip install pytest requests pillow customtkinter cryptography python-dotenv
      - name: Run core tests
        run: python -m pytest tests/ -q
