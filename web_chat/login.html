<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G.I.L. — System Access</title>
<style>
/* Shares the scanner's world so the two screens read as one front door: the
   same deep field, the same cyan, the same grid. The scanner is a machine
   looking at you; this is the machine waiting for you, so it is calmer —
   no scanlines, no sweep, and the motion settles instead of pulsing. */
:root{
  --cyan:#5CE1FF; --cyan-dim:#1B7A94; --deep:#05070D;
  --grid:rgba(92,225,255,.06); --ok:#5CFFB0; --bad:#FF5C7A;
  --ink:#DCEEF6; --muted:#6E8A99;
  --mono:"SF Mono",'Cascadia Mono',Consolas,'Roboto Mono',monospace;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--deep);color:var(--ink);
  font-family:var(--sans);-webkit-font-smoothing:antialiased;}
body{display:flex;align-items:center;justify-content:center;}

/* ── environment ─────────────────────────────────────────────────────────── */
.bg{position:fixed;inset:0;pointer-events:none;}
.bg.grid{background-image:linear-gradient(var(--grid) 1px,transparent 1px),
  linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:48px 48px;
  mask-image:radial-gradient(70% 60% at 50% 45%,#000 20%,transparent 80%);}
.bg.glow{background:radial-gradient(52% 42% at 50% 42%,
  rgba(92,225,255,.11),transparent 70%);}
.bg.vig{background:radial-gradient(115% 85% at 50% 45%,transparent 42%,
  rgba(3,6,12,.62) 74%,#03060C 100%);}

/* ── the card ────────────────────────────────────────────────────────────── */
.card{position:relative;width:min(92vw,392px);padding:38px 36px 30px;
  border-radius:20px;background:rgba(10,17,26,.72);
  border:1px solid rgba(92,225,255,.16);backdrop-filter:blur(22px) saturate(1.25);
  box-shadow:0 30px 90px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);
  animation:rise .6s cubic-bezier(.2,.9,.3,1) both;}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985);filter:blur(6px)}
                to{opacity:1;transform:none;filter:blur(0)}}

.mark{width:46px;height:46px;margin:0 auto 18px;border-radius:13px;
  display:flex;align-items:center;justify-content:center;font-size:20px;
  color:var(--cyan);background:rgba(92,225,255,.10);
  border:1px solid rgba(92,225,255,.30);
  box-shadow:0 0 26px rgba(92,225,255,.22),inset 0 1px 0 rgba(255,255,255,.10);}
h1{font-size:19px;font-weight:600;text-align:center;letter-spacing:-.01em;}
.sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--cyan-dim);text-align:center;
  margin:7px 0 26px;}

/* ── fields ──────────────────────────────────────────────────────────────── */
.f{position:relative;margin-bottom:13px;}
.f input{width:100%;height:50px;padding:19px 14px 6px;border-radius:11px;
  background:rgba(6,11,18,.8);border:1px solid rgba(92,225,255,.15);
  color:var(--ink);font-size:14.5px;font-family:var(--sans);outline:none;
  transition:border-color .18s,box-shadow .18s,background .18s;}
.f input:focus{border-color:rgba(92,225,255,.55);background:rgba(6,11,18,.95);
  box-shadow:0 0 0 3px rgba(92,225,255,.10);}
.f label{position:absolute;left:15px;top:15px;font-size:14px;color:var(--muted);
  pointer-events:none;transition:all .16s cubic-bezier(.2,.9,.3,1);}
.f input:focus + label,.f input:not(:placeholder-shown) + label{
  top:7px;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--cyan-dim);font-family:var(--mono);}
.f .eye{position:absolute;right:6px;top:9px;width:32px;height:32px;border:0;
  background:none;color:var(--muted);cursor:pointer;border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:13px;}
.f .eye:hover{color:var(--cyan);background:rgba(92,225,255,.08);}

/* ── action ──────────────────────────────────────────────────────────────── */
.go{width:100%;height:48px;margin-top:9px;border:0;border-radius:11px;
  background:linear-gradient(180deg,#67E6FF,#33BEE0);color:#04222C;
  font-family:var(--sans);font-size:14.5px;font-weight:650;cursor:pointer;
  letter-spacing:.01em;transition:transform .12s,box-shadow .2s,filter .2s;
  box-shadow:0 8px 26px rgba(92,225,255,.26);}
.go:hover{filter:brightness(1.07);box-shadow:0 10px 32px rgba(92,225,255,.36);}
.go:active{transform:translateY(1px);}
.go:disabled{opacity:.55;cursor:default;filter:none;box-shadow:none;}

.msg{min-height:18px;margin-top:13px;text-align:center;font-size:12.5px;
  color:var(--bad);opacity:0;transition:opacity .2s;}
.msg.on{opacity:1;}
.hint{margin-top:16px;text-align:center;font-size:11px;color:var(--muted);
  line-height:1.6;}
.hint b{color:var(--cyan-dim);font-family:var(--mono);}

.card.bad{animation:shake .42s cubic-bezier(.36,.07,.19,.97) both;}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}

/* ── the welcome ─────────────────────────────────────────────────────────── */
.welcome{position:fixed;inset:0;display:none;align-items:center;
  justify-content:center;flex-direction:column;gap:18px;z-index:10;
  background:radial-gradient(60% 50% at 50% 45%,rgba(92,225,255,.10),
             rgba(5,7,13,.92) 70%);backdrop-filter:blur(10px);}
body.in .welcome{display:flex;animation:fadein .5s ease both;}
body.in .card{animation:sink .45s cubic-bezier(.4,0,1,1) both;}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes sink{to{opacity:0;transform:translateY(-14px) scale(.97);filter:blur(8px)}}

.ring{width:104px;height:104px;position:relative;}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:2.5;}
.ring .t{stroke:rgba(92,225,255,.14)}
.ring .a{stroke:var(--cyan);stroke-linecap:round;
  stroke-dasharray:308;stroke-dashoffset:308;
  animation:draw .85s cubic-bezier(.3,.9,.3,1) .1s forwards;
  filter:drop-shadow(0 0 8px rgba(92,225,255,.7));}
@keyframes draw{to{stroke-dashoffset:0}}
.ring .tick{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font-size:34px;color:var(--cyan);opacity:0;
  animation:pop .5s cubic-bezier(.2,1.5,.4,1) .55s forwards;}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
.hello{font-size:25px;font-weight:600;letter-spacing:-.01em;opacity:0;
  animation:up .55s cubic-bezier(.2,.9,.3,1) .7s both;}
.hello span{color:var(--cyan);}
.line{font-family:var(--mono);font-size:11px;letter-spacing:.17em;
  text-transform:uppercase;color:var(--cyan-dim);opacity:0;
  animation:up .55s cubic-bezier(.2,.9,.3,1) .88s both;}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="bg glow"></div><div class="bg grid"></div><div class="bg vig"></div>

<form class="card" id="card" autocomplete="off">
  <div class="mark">◈</div>
  <h1>Welcome back</h1>
  <div class="sub">G.I.L. · System Access</div>

  <div class="f">
    <input id="u" placeholder=" " autocomplete="username" spellcheck="false">
    <label for="u">Username</label>
  </div>
  <div class="f">
    <input id="p" type="password" placeholder=" " autocomplete="current-password">
    <label for="p">Password</label>
    <button type="button" class="eye" id="eye" title="Show password"
            aria-label="Show password">show</button>
  </div>

  <button class="go" id="go" type="submit">Unlock</button>
  <div class="msg" id="msg" role="alert"></div>
  <div class="hint">Your name isn't case sensitive · <b>Esc</b> to cancel</div>
</form>

<div class="welcome" id="welcome">
  <div class="ring">
    <svg width="104" height="104" viewBox="0 0 104 104">
      <circle class="t" cx="52" cy="52" r="49"></circle>
      <circle class="a" cx="52" cy="52" r="49"></circle>
    </svg>
    <div class="tick">✓</div>
  </div>
  <div class="hello">Welcome back, <span id="who">Sir</span></div>
  <div class="line" id="line">All systems yours</div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
let busy = false;

async function api(method, ...args) {
  const r = await fetch("/api", {method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({method, args})});
  return (await r.json()).result;
}

/* One line, chosen by the hour — a greeting that never changes stops being a
   greeting and becomes furniture. */
function salutation() {
  const h = new Date().getHours();
  if (h < 5)  return "Burning the midnight oil";
  if (h < 12) return "Good morning";
  if (h < 18) return "Good afternoon";
  if (h < 22) return "Good evening";
  return "Late one tonight";
}

$("eye").onclick = () => {
  const p = $("p"), show = p.type === "password";
  p.type = show ? "text" : "password";
  $("eye").textContent = show ? "hide" : "show";
  p.focus();
};

function fail(text) {
  const c = $("card");
  $("msg").textContent = text;
  $("msg").classList.add("on");
  c.classList.remove("bad"); void c.offsetWidth; c.classList.add("bad");
  $("p").select();
}

$("card").onsubmit = async (e) => {
  e.preventDefault();
  if (busy) return;
  const u = $("u").value.trim(), p = $("p").value;
  if (!u || !p) { fail(u ? "Enter your password." : "Enter your username."); return; }

  busy = true; $("go").disabled = true; $("go").textContent = "Checking…";
  let res = null;
  try { res = await api("login", u, p); } catch (err) {}
  busy = false; $("go").disabled = false; $("go").textContent = "Unlock";

  if (!res || !res.ok) {
    fail((res && res.error) || "That didn't match. Try again.");
    return;
  }
  // Signed in: name them, greet them, then get out of the way.
  $("who").textContent = res.name || u;
  $("line").textContent = salutation();
  document.body.classList.add("in");
  setTimeout(() => { api("done").catch(() => {}); }, 1900);
};

addEventListener("keydown", e => {
  if (e.key === "Escape" && !document.body.classList.contains("in")) {
    api("cancel").catch(() => {});
  }
});

$("u").value = (new URLSearchParams(location.search).get("who") || "");
($("u").value ? $("p") : $("u")).focus();
</script>
</body>
</html>
