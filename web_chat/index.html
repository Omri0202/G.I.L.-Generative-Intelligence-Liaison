<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>G.I.L.</title>
<style>
/* ═══════════ G.I.L. 4.0 — web-rendered chat ═══════════ */
:root, [data-theme="dark"] {
  --page:#15161B; --side:#191A21; --surf:#1C1E26; --input:#20222C;
  --border:#282B36; --hover:#262935; --sep:#22242E;
  --txt:#E9EAF2; --muted:#787D91; --dim:#9BA0B4;
  --accent:#58C4DD; --purple:#A78BFA; --ok:#4ADE80; --fail:#F87171;
  --userbg:#242B3D; --uborder:#3A465F; --usertxt:#C9D7F2; --nameu:#87A9DE;
  --btn-txt:#0A1014; --code-bg:#14151B; --shadow:rgba(0,0,0,.45);
}
[data-theme="light"] {
  --page:#FAF9F5; --side:#F0EEE5; --surf:#F4F2EB; --input:#FFFFFF;
  --border:#E5E3D9; --hover:#E9E6DA; --sep:#E5E3D9;
  --txt:#141413; --muted:#8D8A7F; --dim:#6E6B60;
  --accent:#0B9CB8; --purple:#7C5CDB; --ok:#16A34A; --fail:#DC2626;
  --userbg:#FFFFFF; --uborder:#DAD7C9; --usertxt:#3D3929; --nameu:#C96442;
  --btn-txt:#FFFFFF; --code-bg:#F0EEE5; --shadow:rgba(60,50,30,.12);
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; }
body {
  font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  font-size:15px; line-height:1.7; color:var(--txt); background:var(--page);
  overflow:hidden; transition:background .35s ease, color .35s ease;
}
::-webkit-scrollbar { width:9px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:5px; }
::-webkit-scrollbar-thumb:hover { background:var(--muted); }
button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
button svg, .chip svg, .ic svg, .g svg { vertical-align:-2px; }
#newchat { display:flex; align-items:center; justify-content:center; gap:2px; }
.chip svg, .ic svg { display:block; }
.chip { color:var(--accent); }
.arow .ic { color:inherit; display:flex; align-items:center; justify-content:center; }
.rich .g svg { width:20px; height:20px; }
.actions button { display:inline-flex; align-items:center; gap:5px; }
.sess .del { display:flex; align-items:center; }

#app { display:flex; height:100%; }

/* ── Sidebar ─────────────────────────────────────────── */
#sidebar {
  width:264px; min-width:264px; background:var(--side);
  border-right:1px solid var(--sep); display:flex; flex-direction:column;
  transition:background .35s ease;
}
#brand { display:flex; align-items:center; gap:10px; padding:18px 18px 12px; }
#brand .gem {
  width:34px; height:34px; border-radius:10px; display:flex; align-items:center;
  justify-content:center; color:var(--accent); font-size:15px;
  background:linear-gradient(135deg, rgba(88,196,221,.14), rgba(167,139,250,.14));
  border:1px solid var(--accent);
}
#brand b { font-size:16px; letter-spacing:.04em; }
#search {
  margin:4px 14px 10px; padding:9px 13px; border-radius:10px;
  background:var(--input); border:1px solid var(--border); color:var(--txt);
  font-size:13px; outline:none; width:calc(100% - 28px);
  transition:border-color .2s;
}
#search:focus { border-color:var(--accent); }
#newchat {
  margin:0 14px 12px; padding:11px; border-radius:11px; font-weight:600;
  font-size:13.5px; background:var(--accent); color:var(--btn-txt);
  transition:transform .12s ease, filter .15s;
}
#newchat:hover { filter:brightness(1.1); transform:translateY(-1px); }
#sessions { flex:1; overflow-y:auto; padding:2px 10px 12px; }
.sess {
  padding:10px 12px; border-radius:11px; cursor:pointer; margin-bottom:2px;
  transition:background .15s ease; position:relative;
  animation:rise .25s ease both;
}
.sess:hover { background:var(--hover); }
.sess.active { background:var(--surf); box-shadow:inset 2px 0 0 var(--accent); }
.sess .t { font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; padding-right:22px; }
.sess .p { font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; margin-top:1px; }
.sess .del {
  position:absolute; right:8px; top:10px; opacity:0; font-size:12px;
  color:var(--muted); padding:2px 5px; border-radius:6px; transition:opacity .15s, color .15s;
}
.sess:hover .del { opacity:1; }
.sess .del:hover { color:var(--fail); }
#foot { padding:10px 18px 14px; font-size:11px; color:var(--muted);
  border-top:1px solid var(--sep); display:flex; justify-content:space-between; align-items:center; }

/* ── Main column ─────────────────────────────────────── */
#main { flex:1; display:flex; flex-direction:column; min-width:0; }
#topbar {
  display:flex; align-items:center; gap:12px; padding:14px 22px;
  border-bottom:1px solid var(--sep);
}
#title { font-weight:700; font-size:15.5px; flex:1; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; }
.iconbtn {
  width:36px; height:36px; border-radius:10px; display:flex; align-items:center;
  justify-content:center; font-size:15px; color:var(--dim);
  transition:background .15s, color .15s, transform .1s;
}
.iconbtn:hover { background:var(--hover); color:var(--accent); }
.iconbtn:active { transform:scale(.92); }
.iconbtn.off { color:var(--fail); }

/* ── Messages ────────────────────────────────────────── */
#scroll { flex:1; overflow-y:auto; scroll-behavior:smooth; }
#msgs { max-width:820px; margin:0 auto; padding:26px 28px 10px; }
@keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
.msg { animation:rise .3s cubic-bezier(.2,.8,.3,1) both; margin-bottom:22px; }

.msg.user { display:flex; justify-content:flex-end; }
.msg.user .bubble {
  max-width:72%; background:var(--userbg); border:1px solid var(--uborder);
  color:var(--usertxt); padding:12px 18px; border-radius:18px 18px 4px 18px;
  font-size:14.5px; box-shadow:0 2px 10px var(--shadow); white-space:pre-wrap;
  word-wrap:break-word;
}

.msg.gil .head { display:flex; align-items:center; gap:9px; margin-bottom:7px; }
.msg.gil .av {
  width:28px; height:28px; border-radius:9px; display:flex; align-items:center;
  justify-content:center; color:var(--accent); font-size:12px;
  background:linear-gradient(135deg, rgba(88,196,221,.15), rgba(167,139,250,.15));
  border:1px solid var(--accent);
}
.msg.gil .who { font-weight:700; font-size:13px; color:var(--accent); letter-spacing:.03em; }
.msg.gil .ts  { font-size:11px; color:var(--muted); }
.msg.gil .body { padding-left:37px; font-size:15px; max-width:100%; overflow-wrap:break-word; }
.msg.gil .body p { margin:0 0 10px; }
.msg.gil .body p:last-child { margin-bottom:0; }
.msg.gil .body h1,.msg.gil .body h2,.msg.gil .body h3 { margin:14px 0 8px; line-height:1.35; }
.msg.gil .body ul,.msg.gil .body ol { margin:4px 0 10px 22px; }
.msg.gil .body li { margin-bottom:3px; }
.msg.gil .body a { color:var(--accent); text-decoration:none; border-bottom:1px solid transparent; transition:border-color .15s; }
.msg.gil .body a:hover { border-color:var(--accent); }
.msg.gil .body code {
  font-family:"Cascadia Code","Consolas",monospace; font-size:.88em;
  background:var(--code-bg); border:1px solid var(--border);
  padding:1.5px 6px; border-radius:6px;
}
.msg.gil .body pre {
  background:var(--code-bg); border:1px solid var(--border); border-radius:12px;
  padding:0; margin:10px 0; overflow:hidden;
}
.msg.gil .body pre .codehead {
  display:flex; justify-content:space-between; align-items:center;
  padding:7px 14px; border-bottom:1px solid var(--border);
  font-size:11px; color:var(--muted); font-family:inherit;
}
.msg.gil .body pre .copy { font-size:11px; color:var(--muted); padding:2px 8px;
  border-radius:6px; transition:color .15s, background .15s; }
.msg.gil .body pre .copy:hover { color:var(--accent); background:var(--hover); }
.msg.gil .body pre code {
  display:block; padding:12px 16px; background:none; border:none;
  overflow-x:auto; line-height:1.6; font-size:13px;
}
.msg.gil .body blockquote { border-left:3px solid var(--accent); margin:8px 0;
  padding:2px 14px; color:var(--dim); }
.msg .actions { padding-left:37px; margin-top:8px; display:flex; gap:4px;
  opacity:0; transition:opacity .2s; }
.msg:hover .actions { opacity:1; }
.actions button { font-size:11.5px; color:var(--muted); padding:4px 10px;
  border-radius:8px; transition:background .15s, color .15s; }
.actions button:hover { background:var(--hover); color:var(--accent); }

/* ═══════ /codemode — developer terminal (Claude-Code style) ═══════ */
/* Warm Academic Terminal — the premium Claude-Code palette */
body.codemode{--page:#1A1A1A;--side:#161616;--surf:#212120;--input:#1D1D1C;
  --border:#2D2D2D;--hover:#282826;--txt:#EDEAE3;--muted:#8A857B;--dim:#B4AFA3;
  --accent:#E08526;--ok:#6DBE84;--fail:#E5695E;--shadow:rgba(0,0,0,.5);
  --cmfont:"Cascadia Code","JetBrains Mono","Fira Code",Consolas,ui-monospace,monospace;}
body.codemode #sidebar{border-right-color:#1F1F1E;}
body.codemode #topbar{display:none;}          /* replaced by the terminal bar */
body.codemode #welcome{display:none;}
body.codemode .actcard{display:none;}          /* tool blocks replace activity cards */
body.codemode #scroll{background:
  radial-gradient(130% 55% at 50% -12%, rgba(224,133,38,.05), transparent 60%),var(--page);}
body.codemode #msgs{font-family:var(--cmfont);padding-top:6px;}

/* ── terminal top bar (crisp traffic lights + hand-drawn dashed divider) ── */
#cmbar{display:none;align-items:center;gap:12px;padding:11px 22px;
  font-family:"Cascadia Code","JetBrains Mono",Consolas,monospace;
  font-size:12.5px;color:var(--muted);background:var(--side);
  border-bottom:1px dashed var(--border);}
#cmbar .lights{display:flex;gap:8px;}
#cmbar .lights i{width:11px;height:11px;border-radius:50%;
  transition:transform .15s ease, filter .15s ease;}
#cmbar .lights:hover i{filter:brightness(1.18);transform:scale(1.12);}
#cmbar .lights i:nth-child(1){background:#FF5F56;box-shadow:0 0 0 .5px rgba(0,0,0,.35) inset;}
#cmbar .lights i:nth-child(2){background:#FEBC2E;box-shadow:0 0 0 .5px rgba(0,0,0,.35) inset;}
#cmbar .lights i:nth-child(3){background:#28C840;box-shadow:0 0 0 .5px rgba(0,0,0,.35) inset;}
#cmbar .cmtitle{color:var(--txt);font-weight:700;letter-spacing:.02em;}
#cmbar .cmtitle b{color:var(--accent);margin-inline-end:6px;font-weight:700;}
#cmbar .cmpath{margin-inline-start:auto;color:var(--muted);
  max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ── GIL narration → terminal bullet line (amber dot) ── */
body.codemode .msg.gil{margin:0 0 3px 0;}
body.codemode .msg.gil .head,body.codemode .msg.gil .actions{display:none;}
body.codemode .msg.gil .body{position:relative;padding:3px 22px 3px 42px;
  font-family:var(--cmfont);font-size:13px;line-height:1.75;color:var(--dim);}
body.codemode .msg.gil .body::before{content:"";position:absolute;left:21px;top:9px;
  width:7px;height:7px;border-radius:50%;background:var(--accent);}
body.codemode .msg.gil .body p{margin:0;}
body.codemode .msg.gil .body strong{color:var(--txt);}
body.codemode .msg.gil .body code{font-family:var(--cmfont);color:#C7B089;
  background:rgba(224,133,38,.10);padding:1px 5px;border-radius:5px;}
body.codemode .msg.gil .body pre{font-size:12.5px;border-radius:10px;}

/* ── user command → amber prompt echo line ── */
body.codemode .msg.user{margin:14px 0 6px 0;justify-content:flex-start;}
body.codemode .msg.user .bubble{background:none;border:none;box-shadow:none;
  color:var(--txt);font-family:var(--cmfont);font-size:13px;font-weight:600;max-width:none;
  padding:2px 20px 2px 42px;position:relative;}
body.codemode .msg.user .bubble::before{content:"\203A";position:absolute;left:22px;top:1px;
  color:var(--accent);font-weight:800;font-size:16px;}

/* ── input → terminal prompt with bold amber caret ── */
body.codemode #composer{padding-top:6px;}
body.codemode #box{background:var(--input);border-color:var(--border);
  border-radius:12px;padding-left:36px;position:relative;}
body.codemode #box:focus-within{border-color:var(--accent);
  box-shadow:0 0 0 1px rgba(224,133,38,.25);}
body.codemode #box::before{content:"\203A";position:absolute;left:16px;bottom:13px;
  color:var(--accent);font-weight:800;font-size:17px;font-family:var(--cmfont);}
body.codemode #inp{font-family:var(--cmfont);font-size:13.5px;}
body.codemode #send{background:var(--accent);color:#1A1206;}
body.codemode #hint{font-family:"Cascadia Code",Consolas,monospace;}
body.codemode #hint .cmstat b{color:var(--accent);}

/* ── CLI spinner while GIL is working (replaces bouncing dots) ── */
body.codemode #typing{padding-left:42px;}
body.codemode #typing i{display:none;}
body.codemode #typing::before{content:"/";color:var(--accent);font-family:var(--cmfont);
  font-weight:700;font-size:14px;animation:cli 480ms steps(1,end) infinite;
  display:inline-block;width:12px;}
@keyframes cli{0%{content:"/";}25%{content:"\2014";}50%{content:"\\";}75%{content:"|";}}
body.codemode #worktimer{font-family:var(--cmfont);}

/* ── tool-call blocks — clean terminal cards with a thread guide ── */
.tool{margin:0 0 7px 20px;max-width:860px;background:var(--surf);
  border:1px solid var(--border);border-radius:10px;position:relative;
  overflow:hidden;font-family:"Cascadia Code","JetBrains Mono",Consolas,monospace;
  animation:rise .22s ease both;box-shadow:0 1px 8px var(--shadow);}
.tool::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;
  background:var(--border);}
.tool.k-read::before{background:#6E675C;}
.tool.k-write::before{background:#4C8B5E;}
.tool.k-run::before{background:#6E63A8;}
.tool .thead{display:flex;align-items:center;gap:9px;padding:8px 13px 8px 15px;
  font-size:12.5px;cursor:pointer;user-select:none;border-bottom:1px solid transparent;}
.tool.open .thead{border-bottom-color:var(--border);}
.tool .tdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.tool .tdot.ok{background:var(--ok);} .tool .tdot.fail{background:var(--fail);}
/* colour-coded action badges */
.tool .tbadge{font-size:10.5px;font-weight:700;letter-spacing:.02em;
  padding:2px 8px;border-radius:6px;flex-shrink:0;}
.tool .tbadge.read{background:rgba(138,133,123,.16);color:#C9C3B6;}
.tool .tbadge.write{background:rgba(76,139,94,.18);color:#8FD8A0;}
.tool .tbadge.run{background:rgba(110,99,168,.20);color:#B7A9EC;}
.tool .tname{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tool .tkind{color:var(--muted);font-size:11px;}
.tool .tarrow{margin-inline-start:auto;color:var(--muted);display:flex;
  transition:transform .15s;}
.tool.open .tarrow{transform:rotate(90deg);}
.tool .tbody{display:none;padding:10px 14px;overflow-x:auto;font-size:12.5px;line-height:1.65;
  background:#161615;white-space:pre;}
.tool.open .tbody{display:block;}
.tool .tnote{padding:5px 14px;font-size:11px;color:var(--muted);}
/* diff block — clean header with file path + coloured gutters */
.dhead{display:flex;align-items:center;gap:7px;white-space:normal;
  padding:2px 2px 9px;margin-bottom:7px;border-bottom:1px solid var(--border);
  color:var(--dim);font-size:12px;font-weight:600;}
.dhead svg{color:var(--muted);flex-shrink:0;}
.diff .dl{white-space:pre;padding:0 6px;border-radius:2px;}
.diff .add{background:rgba(34,197,94,.12);color:#8FD8A0;}
.diff .del{background:rgba(239,68,68,.12);color:#E9928C;}
.diff .hdr{color:var(--muted);}
/* syntax highlight — warm, low-contrast, blends with the charcoal */
.hl-kw{color:#C08A5E;} .hl-str{color:#A9B665;} .hl-num{color:#D8A657;}
.hl-com{color:#6E675C;font-style:italic;} .hl-fn{color:#83A598;}
.hl-op{color:#A89984;} .hl-punc{color:#928374;}
/* approval card — terminal-styled in code mode */
body.codemode .approval{margin:6px 0 12px 20px;border-color:var(--accent);
  font-family:var(--cmfont);border-radius:10px;}
body.codemode .approval .atext{font-size:13px;}
body.codemode .approval .yes{background:var(--accent);color:#1A1206;}
body.codemode .approval button{font-family:var(--cmfont);}

/* approval card — clickable Approve / Reject (Claude-style) */
.approval { margin:0 0 22px 37px; max-width:640px; background:var(--input);
  border:1px solid var(--accent); border-radius:15px; overflow:hidden;
  animation:rise .3s ease both; box-shadow:0 2px 16px var(--shadow); }
.approval .atext { padding:14px 16px 10px; font-size:14px; }
.approval .atext pre { background:var(--code-bg); border:1px solid var(--border);
  border-radius:10px; padding:10px 13px; margin:8px 0; overflow-x:auto; font-size:12.5px; }
.approval .abtns { display:flex; gap:10px; padding:0 16px 14px; }
.approval button { flex:1; padding:10px; border-radius:10px; font-size:13.5px;
  font-weight:700; transition:filter .15s, transform .1s; }
.approval .yes { background:var(--accent); color:var(--btn-txt); }
.approval .no  { background:var(--hover); color:var(--txt); border:1px solid var(--border); }
.approval button:hover { filter:brightness(1.1); }
.approval button:active { transform:scale(.97); }
.approval.done .abtns { display:none; }
.approval .chose { padding:0 16px 14px; font-size:12.5px; color:var(--muted); display:none; }
.approval.done .chose { display:block; }

/* streaming caret + word-fade (Claude-style typing feel) */
.caret { display:inline-block; width:8px; height:16px; background:var(--accent);
  vertical-align:-2px; border-radius:2px; margin-left:2px;
  animation:blink .9s step-end infinite; }
@keyframes blink { 50% { opacity:0; } }
.msg.gil .body span.w { opacity:0; animation:wfade .3s ease forwards; }
@keyframes wfade { from { opacity:0; filter:blur(1.5px); }
                   to   { opacity:1; filter:none; } }
.msg.gil .body .blockin { animation:rise .35s ease both; }

/* ── Typing indicator ────────────────────────────────── */
#typing { display:none; padding:2px 0 18px 37px; }
#typing.on { display:flex; gap:5px; align-items:center; animation:rise .3s ease; }
#typing i { width:7px; height:7px; border-radius:50%; background:var(--accent);
  animation:bounce 1.2s infinite; opacity:.7; }
#typing i:nth-child(2) { animation-delay:.15s; }
#typing i:nth-child(3) { animation-delay:.3s; }
@keyframes bounce { 0%,60%,100% { transform:none; } 30% { transform:translateY(-6px); } }

/* ── Activity card (Claude-style tools) ──────────────── */
.actcard {
  background:var(--input); border:1px solid var(--border); border-radius:15px;
  margin:0 0 22px 37px; max-width:640px; overflow:hidden;
  animation:rise .3s ease both; box-shadow:0 2px 12px var(--shadow);
}
.actcard .ahead { display:flex; align-items:center; gap:10px; padding:11px 15px 7px; }
.actcard .chip { width:27px; height:27px; border-radius:8px; background:var(--hover);
  display:flex; align-items:center; justify-content:center; font-size:13px; }
.actcard .atitle { font-size:12.5px; font-weight:700; color:var(--dim); }
.actcard .rows { padding:2px 15px 8px; }
.arow { display:flex; align-items:center; gap:9px; padding:4px 0; font-size:13px;
  animation:rise .25s ease both; }
.arow .st { width:16px; text-align:center; font-weight:700; flex-shrink:0; }
.arow .st.run { animation:spin 1s linear infinite; display:inline-block; }
@keyframes spin { to { transform:rotate(360deg); } }
.arow .ic { font-size:12px; width:17px; text-align:center; flex-shrink:0; }
.arow .lbl { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.arow .lbl.link { color:var(--accent); cursor:pointer; }
.arow .lbl.link:hover { text-decoration:underline; }
.arow .det { color:var(--muted); font-size:11.5px; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; flex:1; }
.arow .dur { color:var(--dim); font-size:11px; margin-left:auto; flex-shrink:0; }
.actcard .ribbon { height:3px; background:var(--sep); position:relative; overflow:hidden; }
.actcard .ribbon i { position:absolute; inset:0; background:linear-gradient(90deg,
  transparent, var(--accent), transparent); width:40%;
  animation:sweep 1.1s ease-in-out infinite; }
@keyframes sweep { from { left:-40%; } to { left:100%; } }
.actcard .ribbon.done { background:var(--ok); } .actcard .ribbon.done i { display:none; }
.actcard .ribbon.fail { background:var(--fail); } .actcard .ribbon.fail i { display:none; }

/* ── Rich cards ──────────────────────────────────────── */
.rich { margin:0 0 22px 37px; max-width:560px; animation:rise .3s ease both; }
.rich .site {
  background:var(--input); border:1px solid var(--border); border-radius:14px;
  overflow:hidden; cursor:pointer; transition:transform .15s ease, box-shadow .2s;
  box-shadow:0 2px 12px var(--shadow);
}

<body data-theme="dark">

<script>
"use strict";
/* ═══════════ helpers ═══════════ */
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function api(method, ...args) {
  return fetch("/api", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({method, args})
  }).then(r => r.json()).then(d => d.result).catch(() => null);
}
function fmtTime(ts) {
  const d = ts ? new Date(ts * 1000) : new Date();
  return d.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
}
function scrollDown(force) {
  const sc = $("scroll");
  if (force || sc.scrollTop + sc.clientHeight > sc.scrollHeight - 320)
    sc.scrollTop = sc.scrollHeight;
}

/* ═══════════ syntax highlighter (compact, self-contained) ═══════════ */
const HL_KW = new Set(("def class return if elif else for while import from as with "+
  "try except finally raise yield lambda pass break continue in is not and or None "+
  "True False self async await global nonlocal assert del function const let var new "+
  "typeof instanceof this null undefined true false export default extends super "+
  "switch case do throw void fn mut pub struct enum impl trait match use mod crate "+
  "move ref func package type interface map range go defer chan select public private "+
  "protected static final abstract int float double bool boolean char string str vec")
  .split(" "));
function hl(code, lang){
  const re=/(\/\*[\s\S]*?\*\/|\/\/.*|#.*)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`)|\b(0x[0-9a-fA-F]+|\d+\.?\d*)\b|([A-Za-z_$][\w$]*)/g;
  let out="", last=0, m;
  while((m=re.exec(code))){
    out+=esc(code.slice(last,m.index)); last=re.lastIndex;
    if(m[1]) out+='<span class="hl-com">'+esc(m[1])+'</span>';
    else if(m[2]) out+='<span class="hl-str">'+esc(m[2])+'</span>';
    else if(m[3]) out+='<span class="hl-num">'+esc(m[3])+'</span>';
    else{const w=m[4];
      if(HL_KW.has(w)) out+='<span class="hl-kw">'+esc(w)+'</span>';
      else if(code[re.lastIndex]==="(") out+='<span class="hl-fn">'+esc(w)+'</span>';
      else out+=esc(w);}
  }
  return out+esc(code.slice(last));
}
function renderDiff(oldT, newT){
  const o = (oldT||"").split("\n"), n = (newT||"").split("\n");
  let h = "";
  o.forEach(l => h += '<div class="dl del">- '+esc(l)+'</div>');
  n.forEach(l => h += '<div class="dl add">+ '+esc(l)+'</div>');
  return h;
}

/* ═══════════ markdown (tiny, safe) ═══════════ */
function md(src) {
  src = esc(src);
  const blocks = [];
  src = src.replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => {
    blocks.push({lang: lang || "code", code});
    return "␀B" + (blocks.length - 1) + "␀";
  });
  src = src
    .replace(/^### (.*)$/gm, "<h3>$1</h3>")
    .replace(/^## (.*)$/gm, "<h2>$1</h2>")
    .replace(/^# (.*)$/gm, "<h1>$1</h1>")
    .replace(/^&gt; (.*)$/gm, "<blockquote>$1</blockquote>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>")
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" onclick="api(\'open_path\', this.href); return false;">$1</a>');
  // lists
  src = src.replace(/((?:^[-•] .*\n?)+)/gm,
    m => "<ul>" + m.trim().split(/\n/).map(l => "<li>" + l.replace(/^[-•] /, "") + "</li>").join("") + "</ul>");
  src = src.replace(/((?:^\d+\. .*\n?)+)/gm,
    m => "<ol>" + m.trim().split(/\n/).map(l => "<li>" + l.replace(/^\d+\. /, "") + "</li>").join("") + "</ol>");
  // paragraphs
  src = src.split(/\n{2,}/).map(p =>
    /^<(h\d|ul|ol|blockquote|␀)/.test(p.trim()) ? p : "<p>" + p.replace(/\n/g, "<br>") + "</p>"
  ).join("");
  // restore code blocks
  src = src.replace(/␀B(\d+)␀/g, (m, i) => {
    const b = blocks[+i];
    return `<pre><div class="codehead"><span>${esc(b.lang)}</span>` +
      `<button class="copy" onclick="gil.copyCode(this)">copy</button></div>` +
      `<code>${b.code}</code></pre>`;
  });
  return src;
}

/* ═══════════ hand-drawn line icons (no emoji — GIL design rule) ═══════════ */
const _P = {
  robot:  '<rect x="5" y="8" width="14" height="10" rx="3"/><line x1="12" y1="8" x2="12" y2="4.5"/><circle cx="12" cy="3.8" r="1"/><circle cx="9.5" cy="13" r="1.1" fill="currentColor" stroke="none"/><circle cx="14.5" cy="13" r="1.1" fill="currentColor" stroke="none"/>',
  code:   '<polyline points="8 7 3.5 12 8 17"/><polyline points="16 7 20.5 12 16 17"/><line x1="13.5" y1="4.5" x2="10.5" y2="19.5"/>',
  globe:  '<circle cx="12" cy="12" r="8.5"/><line x1="3.5" y1="12" x2="20.5" y2="12"/><path d="M12 3.5a13 13 0 0 1 0 17a13 13 0 0 1 0-17z"/>',
  search: '<circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.5" y1="15.5" x2="21" y2="21"/>',
  image:  '<rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="9" cy="9.7" r="1.6"/><polyline points="4.5 17.5 10 12 13 15 16 11.5 19.5 15.5"/>',

  system: '<polyline points="3 12 7.5 12 10 5.5 14 18.5 16.5 12 21 12"/>',
  music:  '<path d="M9.5 17.5V5.5L19 4v12"/><circle cx="7.2" cy="17.6" r="2.3"/><circle cx="16.7" cy="16.1" r="2.3"/>',
  vision: '<path d="M3.5 8h5l2-2.5h4L16.5 8h4v11h-17z"/><circle cx="12" cy="13.3" r="3.3"/>',
  note:   '<path d="M4 20l1-4L16.5 4.5l3 3L8 19l-4 1z"/>',
  spark:  '<path d="M12 3.5l1.8 6.7 6.7 1.8-6.7 1.8L12 20.5l-1.8-6.7L3.5 12l6.7-1.8z"/>',
  volume: '<path d="M4 9.5v5h3.5l4.5 3.7V5.8L7.5 9.5H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18 6.8a8 8 0 0 1 0 10.4"/>',
  muted:  '<path d="M4 9.5v5h3.5l4.5 3.7V5.8L7.5 9.5H4z"/><line x1="16" y1="9.5" x2="21" y2="14.5"/><line x1="21" y1="9.5" x2="16" y2="14.5"/>',
  moon:   '<path d="M20 13.5A8 8 0 1 1 10.5 4a6.3 6.3 0 0 0 9.5 9.5z"/>',
  sun:    '<circle cx="12" cy="12" r="4"/><line x1="12" y1="2.5" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="21.5"/><line x1="2.5" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="21.5" y2="12"/><line x1="5.3" y1="5.3" x2="7" y2="7"/><line x1="17" y1="17" x2="18.7" y2="18.7"/><line x1="18.7" y1="5.3" x2="17" y2="7"/><line x1="7" y1="17" x2="5.3" y2="18.7"/>',
  trash:  '<line x1="4.5" y1="7" x2="19.5" y2="7"/><path d="M6.5 7l1 13h9l1-13"/><path d="M9.5 7V4h5v3"/><line x1="10.5" y1="10.5" x2="10.5" y2="16.5"/><line x1="13.5" y1="10.5" x2="13.5" y2="16.5"/>',
  copy:   '<rect x="8.5" y="8.5" width="12" height="12" rx="2"/><path d="M4 15.5V5a1 1 0 0 1 1-1h10.5"/>',
  chev:   '<polyline points="9 6 15 12 9 18"/>',
};
function svg(name, size) {
  return `<svg width="${size||14}" height="${size||14}" viewBox="0 0 24 24" fill="none" ` +
    `stroke="currentColor" stroke-width="1.8" stroke-linecap="round" ` +
    `stroke-linejoin="round">${_P[name] || _P.system}</svg>`;
}

/* ═══════════ core UI object (called from Python too) ═══════════ */
const KIND = {
  brain:  ["robot",  "Thinking",              "#A78BFA"],
  code:   ["code",   "Working on code",        "#4ADE80"],
  web:    ["globe",  "Building the site",      "#58C4DD"],
  search: ["search", "Searching your computer","#FBBF24"],
  image:  ["image",  "Creating an image",      "#F472B6"],
  file:   ["file",   "Accessing your files",   "#60A5FA"],
  system: ["system", "Working",                "#94A3B8"],
  media:  ["music",  "Controlling media",      "#34D399"],
  vision: ["vision", "Looking at the screen",  "#F87171"],
  note:   ["note",   "Notes",                  "#FACC15"],
  app:    ["spark",  "Working",                "#58C4DD"],
};
const PATH_RE = /[A-Za-z]:\\[^\n:*?"<>|]{3,}/;

const gil = {
  sessions: [], current: "", actCard: null, actRows: {}, running: new Set(),

  /* ---- messages ---- */
  addMessage(m) {
    $("welcome").style.display = "none";
    this.hideTyping();
    const wrap = document.createElement("div");
    if (m.sender === "user") {
      wrap.className = "msg user";
      wrap.innerHTML = `<div class="bubble"></div>`;
      wrap.querySelector(".bubble").textContent = m.text;
      $("msgs").insertBefore(wrap, $("typing"));
      scrollDown(true);
    } else {
      wrap.className = "msg gil";
      wrap.innerHTML =
        `<div class="head"><div class="av">◈</div><span class="who">G.I.L.</span>` +
        `<span class="ts">${fmtTime(m.ts)}</span></div><div class="body"></div>` +
        `<div class="actions"><button onclick="gil.copyMsg(this)">${svg("copy",12)} copy</button></div>`;
      $("msgs").insertBefore(wrap, $("typing"));
      const body = wrap.querySelector(".body");
      if (m.stream === false) { body.innerHTML = md(m.text); scrollDown(); }
      else this.streamInto(body, m.text);
    }
    wrap.dataset.raw = m.text;
  },

  streamInto(el, text) {
    // Handwritten Claude-style streaming:
    //  - the message flows in block by block (paragraphs, lists, code)
    //  - inside a text block, words fade in one by one behind a live caret,
    //    with human pacing: variable speed, breaths at commas, pauses at
    //    sentence ends, a beat between paragraphs
    //  - each block snaps to full markdown the moment it finishes, so
    //    formatting appears progressively — not in one jump at the end
    el.innerHTML = "";
    const blocks = text.split(/\n{2,}/).filter(b => b.trim());
    let bi = 0;

    const nextBlock = () => {
      if (bi >= blocks.length) { el.innerHTML = md(text); scrollDown(); return; }
      const block = blocks[bi++];

      // code blocks and lists appear as rendered units (like Claude)
      if (/^```/.test(block.trim()) || /^[-•]|^\d+\. /m.test(block.trim())) {
        const d = document.createElement("div");
        d.className = "blockin";
        d.innerHTML = md(block);
        el.appendChild(d);
        scrollDown();
        setTimeout(nextBlock, 220);
        return;
      }

      const p = document.createElement("p");
      el.appendChild(p);
      const caret = document.createElement("span");
      caret.className = "caret";
      p.appendChild(caret);
      const words = block.split(/(\s+)/);
      let i = 0;

      const tick = () => {
        let added = 0;
        while (added < 2 && i < words.length) {
          const w = words[i++];
          if (!w) continue;
          if (w.trim()) {
            const s = document.createElement("span");
            s.className = "w";
            s.textContent = w;
            p.insertBefore(s, caret);
            added++;
          } else {
            const parts = w.split("\n");
            parts.forEach((pp, idx) => {
              if (idx > 0) p.insertBefore(document.createElement("br"), caret);
              if (pp) p.insertBefore(document.createTextNode(pp), caret);
            });
          }
        }
        scrollDown();
        if (i < words.length) {
          const last = (words[i - 1] || "").trim();
          let pause = 16 + Math.random() * 30;          // human jitter
          if (/[.!?]$/.test(last)) pause = 150 + Math.random() * 80;
          else if (/[,;:]$/.test(last)) pause = 70 + Math.random() * 40;
          setTimeout(tick, pause);
        } else {
          // paragraph done — snap it to real markdown, breathe, continue
          const rendered = md(block);
          const wrap = document.createElement("div");
          wrap.innerHTML = rendered;
          p.replaceWith(...wrap.childNodes);
          scrollDown();
          setTimeout(nextBlock, 190);
        }
      };
      tick();
    };
    nextBlock();
  },

  showTyping() { $("welcome").style.display="none"; $("typing").classList.add("on"); this.startTimer(); scrollDown(true); },
  hideTyping() { $("typing").classList.remove("on"); this.scheduleStop(); },

  /* ---- live work timer (Claude-style "working 12s") ----
     Runs continuously from the first sign of work until GIL is truly idle —
     an intermediate "Checking…" message no longer stops it while research or
     an activity card is still running. "Busy" = typing dots on OR any
     activity step running OR an approval pending. A grace period bridges the
     gaps between an ack message, the research starting, and the final answer. */
  _timerStart: 0, _timerId: null, _stopT: null,
  busy() {
    return $("typing").classList.contains("on")
        || (this.running && this.running.size > 0)
        || !!this._approvalOpen;
  },
  startTimer() {
    if (this._stopT) { clearTimeout(this._stopT); this._stopT = null; }
    if (this._timerId) return;              // already running — keep the clock
    this._timerStart = Date.now();
    const tick = () => {
      const s = (Date.now() - this._timerStart) / 1000;
      $("worktimer").textContent = "working " +
        (s < 60 ? s.toFixed(0) + "s" : Math.floor(s/60) + "m " + Math.floor(s%60) + "s");
    };
    tick();
    this._timerId = setInterval(tick, 250);
  },
  scheduleStop() {
    // Only stop once GIL has been idle for a grace window — never mid-task.
    if (this._stopT) clearTimeout(this._stopT);
    this._stopT = setTimeout(() => {
      this._stopT = null;
      if (this.busy()) { this.scheduleStop(); return; }   // still working → keep going
      this.stopTimer();
    }, 2500);
  },
  resetTimer() { this.stopTimer(); },
  stopTimer() {
    if (this._stopT) { clearTimeout(this._stopT); this._stopT = null; }
    if (this._timerId) { clearInterval(this._timerId); this._timerId = null; }
    $("worktimer").textContent = "";
  },

  copyMsg(btn) {
    navigator.clipboard.writeText(btn.closest(".msg").dataset.raw || "");
    btn.textContent = "✓ copied";
    setTimeout(() => btn.innerHTML = svg("copy",12) + " copy", 1200);
  },
  copyCode(btn) {
    navigator.clipboard.writeText(btn.closest("pre").querySelector("code").textContent);
    btn.textContent = "✓"; setTimeout(() => btn.textContent = "copy", 1200);
  },

  /* ---- activity (Claude-style tool cards) ---- */
  activity(e) {
    if (e.status === "running") this.startTimer();   // keep the work timer alive
    if (this.actRows[e.id]) return this.updateRow(e);
    if (!this.actCard || this.actCard.dataset.group !== (e.group || "")) {
      if (this.actCard && this.running.size) { /* keep card while running */ }
      this.newCard(e);
    }
    this.addRow(e);
  },
  newCard(e) {
    const k = KIND[e.kind] || KIND.system;
    const c = document.createElement("div");
    c.className = "actcard"; c.dataset.group = e.group || "";
    c.innerHTML = `<div class="ahead"><div class="chip" style="color:${k[2]}">${svg(k[0], 14)}</div>` +
      `<div class="atitle">${esc(e.group || k[1])}</div></div>` +
      `<div class="rows"></div><div class="ribbon"><i></i></div>`;
    $("msgs").insertBefore(c, $("typing"));
    this.actCard = c; this.actRows = {}; this.running = new Set();
    scrollDown(true);
  },
  addRow(e) {
    const k = KIND[e.kind] || KIND.system;
    const r = document.createElement("div");
    r.className = "arow";
    const running = e.status === "running";
    const pathM = (e.title || "").match(PATH_RE) || (e.detail || "").match(PATH_RE);
    r.innerHTML =
      `<span class="st ${running ? "run" : ""}" style="color:${running ? "var(--accent)" : e.status === "done" ? "var(--ok)" : "var(--fail)"}">${running ? "◐" : e.status === "done" ? "✓" : "✕"}</span>` +
      `<span class="ic" style="color:${k[2]}">${svg(k[0], 12)}</span>` +
      `<span class="lbl ${pathM ? "link" : ""}">${esc(e.title)}</span>` +
      `<span class="det">${esc(e.detail || "")}</span><span class="dur"></span>`;
    if (pathM) r.querySelector(".lbl").onclick = () => api("open_path", pathM[0]);
    this.actCard.querySelector(".rows").appendChild(r);
    this.actRows[e.id] = r;
    if (running) this.running.add(e.id); else this.settle();
    scrollDown();
  },
  updateRow(e) {
    const r = this.actRows[e.id];
    const st = r.querySelector(".st");
    if (e.status === "running") { r.querySelector(".det").textContent = e.detail || ""; return; }
    st.classList.remove("run");
    st.textContent = e.status === "done" ? "✓" : "✕";
    st.style.color = e.status === "done" ? "var(--ok)" : "var(--fail)";
    if (e.detail) r.querySelector(".det").textContent = e.detail;
    if (e.duration >= 0.05)
      r.querySelector(".dur").textContent = e.duration < 60 ?
        e.duration.toFixed(1) + "s" : (e.duration / 60).toFixed(1) + "m";
    this.running.delete(e.id);
    this.settle();
  },
  settle() {
    if (this.running.size || !this.actCard) return;
    const anyFail = [...this.actCard.querySelectorAll(".st")].some(s => s.textContent === "✕");
    const rib = this.actCard.querySelector(".ribbon");
    rib.className = "ribbon " + (anyFail ? "fail" : "done");
    const card = this.actCard;
    setTimeout(() => { if (this.actCard === card && !this.running.size) this.actCard = null; }, 4000);
    this.scheduleStop();   // activity finished → let the timer wind down (if idle)
  },

  /* ---- approval card (click Approve / Reject, no typing yes/no) ---- */
  approval(c) {
    this.hideTyping();
    this._approvalOpen = true;          // keeps the work timer running
    this.startTimer();
    const d = document.createElement("div");
    d.className = "approval";
    d.innerHTML =
      `<div class="atext">${md(c.text || "Approve this action?")}</div>` +
      `<div class="abtns"><button class="yes">✓ Approve</button>` +
      `<button class="no">✕ Reject</button></div>` +
      `<div class="chose"></div>`;
    const done = (ok) => {
      this._approvalOpen = false;
      d.classList.add("done");
      d.querySelector(".chose").textContent = ok ? "✓ Approved" : "✕ Rejected";
      api("approve", c.kind || "agent", ok);
      if (ok) this.showTyping();        // work resumes
      else this.scheduleStop();
    };
    d.querySelector(".yes").onclick = () => done(true);
    d.querySelector(".no").onclick  = () => done(false);
    $("msgs").insertBefore(d, $("typing"));
    scrollDown(true);
  },

  /* ---- /codemode: developer terminal ---- */
  setCodeMode(on) {
    document.body.classList.toggle("codemode", !!on);
    // build the terminal top bar once, then show/hide it
    let bar = document.getElementById("cmbar");
    if (on && !bar) {
      bar = document.createElement("div");
      bar.id = "cmbar";
      bar.innerHTML =
        `<span class="lights"><i></i><i></i><i></i></span>` +
        `<span class="cmtitle"><b>◈</b>GIL · coding agent</span>` +
        `<span class="cmpath">dev terminal — asks before every change</span>`;
      const main = $("main");
      main.insertBefore(bar, $("scroll"));
    }
    if (bar) bar.style.display = on ? "flex" : "none";
    $("inp").placeholder = on
      ? "describe a coding task — GIL reads, edits & runs, asking first"
      : "Message G.I.L.  —  Enter sends, Shift+Enter for a new line, / for commands";
    $("hint").innerHTML = on
      ? `<span class="cmstat"><b>● codemode</b> &nbsp;·&nbsp; GIL asks before each change ` +
        `&nbsp;·&nbsp; type <b>yes</b>/<b>no</b> or click &nbsp;·&nbsp; <b>/chat</b> to leave</span>`
      : `Type <b>/</b> for commands · G.I.L. shows every tool he uses, live.`;
    scrollDown();
  },
  toolBlock(b) {
    this.hideTyping();
    const okc = b.ok ? "ok" : "fail";
    // action badge: label + colour-group (read=slate, write=green, run=indigo)
    const BADGE = { bash:["Bash","run"], run:["Bash","run"], read:["Read","read"],
      list_dir:["List","read"], search:["Search","read"], edit:["Edit","write"],
      write:["Write","write"] };
    const [blabel, bgroup] = BADGE[b.kind] || ["Tool", "read"];
    // header comes in as "Verb(target)" — show just the target next to the badge
    const hm = /^[^(]*\((.*)\)\s*$/.exec(b.header || "");
    const name = hm ? hm[1] : (b.header || b.kind || "");
    const d = document.createElement("div");
    d.className = "tool k-" + bgroup;
    let bodyHTML = "";
    if (b.kind === "edit" && b.diff) {
      bodyHTML = `<div class="dhead">${svg("file", 13)}<span>${esc(name)}</span></div>` +
        renderDiff(b.diff.old, b.diff.new);
    } else if (b.body != null) {
      bodyHTML = hl(b.body, b.lang || "");
    }
    d.innerHTML =
      `<div class="thead"><span class="tdot ${okc}"></span>` +
      `<span class="tbadge ${bgroup}">${esc(blabel)}</span>` +
      `<span class="tname">${esc(name)}</span>` +
      (b.note ? `<span class="tkind">${esc(b.note)}</span>` : "") +
      `<span class="tarrow">${svg("chev", 12)}</span></div>` +
      (bodyHTML ? `<div class="tbody ${b.kind==="edit"?"diff":""}">${bodyHTML}</div>` : "");
    d.querySelector(".thead").onclick = () => d.classList.toggle("open");
    // auto-open edits/writes so the user sees the change; collapse noisy reads
    if (b.kind === "edit" || b.kind === "write") d.classList.add("open");
    $("msgs").insertBefore(d, $("typing"));
    scrollDown();
  },

  /* ---- rich cards ---- */
  richCard(c) {
    this.hideTyping();
    const d = document.createElement("div");
    d.className = "rich";
    if (c.kind === "image" && c.thumb) {
      d.innerHTML = `<img class="thumb" src="${c.thumb}" title="Click to open">`;
      d.querySelector("img").onclick = () => api("open_path", c.path);
    } else {
      d.innerHTML =
        `<div class="site"><div class="chrome"><div class="dots">` +
        `<i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i></div>` +
        `<span>${esc((c.path || "").slice(-44))}</span></div>` +
        `<div class="body2"><span class="g">${svg("globe", 20)}</span><div><div class="tt">${esc(c.title || "Website")}</div>` +
        `<div class="sub">Multi-page site • Customize panel on the page</div></div>` +
        `<button class="open">Open</button></div></div>`;
      d.querySelector(".site").onclick = () => api("open_path", c.path);
    }
    $("msgs").insertBefore(d, $("typing"));
    scrollDown(true);
  },

  /* ---- sessions ---- */
  setSessions(list) {
    this.sessions = list;
    const q = ($("search").value || "").toLowerCase();
    const box = $("sessions"); box.innerHTML = "";
    list.filter(s => !q || (s.name || "").toLowerCase().includes(q) ||
                     (s.preview || "").toLowerCase().includes(q))
      .forEach(s => {
        const d = document.createElement("div");
        d.className = "sess" + (s.id === this.current ? " active" : "");
        d.innerHTML = `<div class="t"></div><div class="p"></div><button class="del">${svg("trash", 13)}</button>`;
        d.querySelector(".t").textContent = s.name || "Conversation";
        d.querySelector(".p").textContent = s.preview || (s.msg_count + " messages");
        d.onclick = () => api("open_session", s.id);
        d.querySelector(".del").onclick = ev => {
          ev.stopPropagation();
          if (confirm("Delete this conversation?")) api("delete_session", s.id);
        };
        box.appendChild(d);
      });
  },
  filter() { this.setSessions(this.sessions); },
  loadMessages(payload) {
    $("msgs").querySelectorAll(".msg,.actcard,.rich").forEach(n => n.remove());
    this.actCard = null; this.actRows = {}; this.running = new Set();
    this.current = payload.id;
    $("title").textContent = payload.name || "New conversation";
    $("welcome").style.display = payload.messages.length ? "none" : "";
    payload.messages.forEach(m => {
      if (m.rich) this.richCard(m.rich);
      else this.addMessage({...m, stream:false});
    });
    scrollDown(true);
  },
  sessionNamed(id, title) {
    if (id === this.current) $("title").textContent = title;
    api("sessions").then(s => s && this.setSessions(s));
  },

  /* ---- controls ---- */
  setTheme(t) {
    document.body.dataset.theme = t;
    $("themebtn").innerHTML = svg(t === "dark" ? "moon" : "sun", 16);
  },
  toggleTheme() {
    const t = document.body.dataset.theme === "dark" ? "light" : "dark";
    this.setTheme(t); api("set_theme", t);
  },
  setVoice(on) {
    $("voicebtn").innerHTML = svg(on ? "volume" : "muted", 16);
    $("voicebtn").classList.toggle("off", !on);
  },
  setVersion(v) { $("ver").textContent = "G.I.L. v" + v; },

  send() {
    const t = $("inp").value.trim();
    if (!t) return;
    // Slash command? route it instead of sending as a plain message.
    if (t[0] === "/") { this.runCommand(t); return; }
    $("inp").value = ""; this.grow();
    this.resetTimer();                 // new turn → fresh clock
    this.addMessage({sender: "user", text: t});
    this.showTyping();
    api("send", t);
  },
  grow() {
    const i = $("inp");
    i.style.height = "auto";
    i.style.height = Math.min(180, i.scrollHeight) + "px";
    $("send").classList.toggle("ready", !!i.value.trim());
  },

  /* ---- slash commands ---- */
  COMMANDS: [
    {cmd: "/goal",     desc: "Give GIL a goal to complete autonomously", kind: "arg"},
    {cmd: "/research", desc: "Look something up live with sources",       kind: "arg"},
    {cmd: "/study",    desc: "Open your interactive study area (exam prep courses)", kind: "arg"},
    {cmd: "/website",  desc: "Build a website for…",                      kind: "arg"},
    {cmd: "/image",    desc: "Generate an image of…",                     kind: "arg"},
    {cmd: "/code",     desc: "Have GIL write or fix code",                kind: "arg"},
    {cmd: "/codemode", desc: "Enter the developer terminal (Claude-Code style)", kind: "arg"},
    {cmd: "/remember", desc: "Tell GIL a fact to remember (not search)",  kind: "arg"},
    {cmd: "/stop",     desc: "Stop what GIL is doing",                    kind: "meta"},
    {cmd: "/voice",    desc: "Toggle GIL's voice on/off",                 kind: "meta"},
    {cmd: "/clear",    desc: "Start a new conversation",                  kind: "meta"},
    {cmd: "/help",     desc: "Show what GIL can do",                      kind: "meta"},
  ],
  _slashSel: 0,
  slashUpdate() {
    const v = $("inp").value;
    const menu = $("slashmenu");
    // Only while typing the command word itself (a leading /token, no space yet)
    if (v[0] !== "/" || /\s/.test(v)) { menu.classList.remove("on"); return; }
    const q = v.slice(1).toLowerCase();
    const matches = this.COMMANDS.filter(c => c.cmd.slice(1).startsWith(q));
    if (!matches.length) { menu.classList.remove("on"); return; }
    this._slashSel = Math.min(this._slashSel, matches.length - 1);
    this._slashMatches = matches;
    menu.innerHTML = matches.map((c, i) =>
      `<div class="cmd ${i === this._slashSel ? "sel" : ""}" data-i="${i}">` +
      `<b>${c.cmd}</b><span>${c.desc}</span></div>`).join("");
    menu.classList.add("on");
    menu.querySelectorAll(".cmd").forEach(el =>
      el.onclick = () => this.slashPick(+el.dataset.i));
  },
  slashNav(dir) {
    if (!this._slashMatches) return;
    this._slashSel = (this._slashSel + dir + this._slashMatches.length) % this._slashMatches.length;
    this.slashUpdate();
  },
  slashActive() { return $("slashmenu").classList.contains("on"); },
  slashPick(i) {
    const c = this._slashMatches[i != null ? i : this._slashSel];
    if (!c) return;
    $("slashmenu").classList.remove("on");
    if (c.kind === "arg") { $("inp").value = c.cmd + " "; $("inp").focus(); this.grow(); }
    else this.runCommand(c.cmd);
  },
  runCommand(text) {
    $("slashmenu").classList.remove("on");
    const sp = text.indexOf(" ");
    const cmd = (sp < 0 ? text : text.slice(0, sp)).toLowerCase();
    const arg = sp < 0 ? "" : text.slice(sp + 1).trim();
    const known = this.COMMANDS.find(c => c.cmd === cmd);
    if (!known) {   // unknown /command → just send as text
      $("inp").value = ""; this.grow();
      this.addMessage({sender: "user", text}); this.showTyping(); api("send", text);
      return;
    }
    // /study and /codemode run even with no argument.
    const noArgOk = (cmd === "/study" || cmd === "/codemode");
    if (known.kind === "arg" && !arg && !noArgOk) { $("inp").value = cmd + " "; this.grow(); return; }
    $("inp").value = ""; this.grow();
    if (arg) this.addMessage({sender: "user", text: cmd + " " + arg});
    else if (noArgOk) this.addMessage({sender: "user", text: cmd});
    if (cmd === "/clear") { api("new_chat"); return; }
    if (cmd === "/voice") { api("toggle_voice"); return; }
    if (cmd === "/stop")  { api("command", "stop", ""); return; }
    if (cmd === "/help")  { this.showTyping(); api("command", "help", ""); return; }
    // arg commands → backend maps to the right action
    this.showTyping();
    api("command", cmd.slice(1), arg);
  },
};
window.gil = gil;

/* ═══════════ input wiring ═══════════ */
$("inp").addEventListener("input", () => { gil.grow(); gil.slashUpdate(); });
$("inp").addEventListener("keydown", e => {
  if (gil.slashActive()) {
    if (e.key === "ArrowDown") { e.preventDefault(); gil.slashNav(1); return; }
    if (e.key === "ArrowUp")   { e.preventDefault(); gil.slashNav(-1); return; }
    if (e.key === "Tab")       { e.preventDefault(); gil.slashPick(); return; }
    if (e.key === "Escape")    { $("slashmenu").classList.remove("on"); return; }
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); gil.slashPick(); return; }
  }
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); gil.send(); }
});

/* ═══════════ Python → browser push (Server-Sent Events) ═══════════ */
(function connectSSE() {
  const es = new EventSource("/events");
  es.onmessage = ev => {
    try {
      const {fn, arg} = JSON.parse(ev.data);
      const parts = fn.split(".");            // e.g. "gil.addMessage"
      const target = parts[0] === "gil" ? gil : window;
      const f = target[parts[1]];
      if (typeof f === "function") f.call(target, arg);
    } catch (e) { console.warn("sse", e); }
  };
  es.onerror = () => { /* EventSource auto-reconnects */ };
})();

/* boot: pull initial state from Python */
function boot() {
  api("ready").then(st => {
    if (!st) { setTimeout(boot, 300); return; }
    gil.setTheme(st.theme || "dark");
    gil.setVoice(st.voice !== false);
    gil.setVersion(st.version || "4.0");
    gil.setSessions(st.sessions || []);
    if (st.current) gil.loadMessages(st.current);
  });
}
boot();
</script>
